# Sunucuda ses kartı kullanılmıyor (Piper ses dosyası üretir). snd_sof sürücüsü HP 15-dw4xxx'te bir çekirdeği
# sürekli %100 dolduruyordu (sof_probe_work döngüsü, 36 saat). Açılışta yüklenmesin.
blacklist snd_sof_pci_intel_tgl
install snd_sof_pci_intel_tgl /bin/false
blacklist snd_sof_pci_intel_cnl
install snd_sof_pci_intel_cnl /bin/false
blacklist snd_hda_intel
install snd_hda_intel /bin/false
